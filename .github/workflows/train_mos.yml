name: Train Northern AZ HRRR MOS Equations

on:
  workflow_dispatch:
    inputs:
      discover_coop:
        description: 'Auto-discover & add all active Northern AZ COOP sites from IEM'
        required: true
        default: true
        type: boolean
      retrain_all:
        description: 'Retrain ALL stations from scratch (leave unchecked to train only newly discovered sites)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  train-mos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HRRR-Zarr pixel series
        uses: actions/cache@v4
        with:
          path: zarr_pixel_cache
          key: hrrr-zarr-cache-${{ hashFiles('stations.json') }}-v1
          restore-keys: |
            hrrr-zarr-cache-

      - name: Install training packages
        run: pip install -q aiohttp fsspec numcodecs "numpy<2" pandas requests tqdm "zarr<3"

      - name: Run HRRR MOS regression training
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.discover_coop }}" = "true" ]; then
            ARGS="$ARGS --discover-coop"
          fi
          if [ "${{ github.event.inputs.retrain_all }}" = "true" ]; then
            ARGS="$ARGS --retrain-all"
          fi
          python -u train_mos.py $ARGS

      - name: Commit updated stations.json and mos_equations.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json mos_equations.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Discover & train active Northern AZ COOP stations [skip ci]"
          git push
