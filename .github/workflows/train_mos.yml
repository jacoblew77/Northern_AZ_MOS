name: Train Northern AZ HRRR MOS Equations

on:
  workflow_dispatch:
    inputs:
      discover_networks:
        description: 'Auto-discover all active public Northern AZ stations (Synoptic + IEM COOP)'
        required: true
        default: false
        type: boolean
      retrain_all:
        description: 'Retrain ALL stations from scratch (uses cached HRRR & obs when available)'
        required: true
        default: true
        type: boolean
      refresh_obs:
        description: 'Force fresh Synoptic/IEM observation download (bypass obs_cache)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  train-mos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HRRR-Zarr pixel series
        uses: actions/cache@v4
        with:
          path: zarr_pixel_cache
          key: hrrr-zarr-cache-${{ hashFiles('stations.json') }}-v2
          restore-keys: |
            hrrr-zarr-cache-

      - name: Cache daily surface observation series
        uses: actions/cache@v4
        with:
          path: obs_cache
          key: obs-diurnal-cache-${{ hashFiles('stations.json') }}-v1
          restore-keys: |
            obs-diurnal-cache-

      - name: Install training packages
        run: pip install -q aiohttp fsspec numcodecs "numpy<2" pandas requests tqdm "zarr<3"

      - name: Run HRRR MOS regression training
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.discover_networks }}" = "true" ]; then
            ARGS="$ARGS --discover-networks"
          fi
          if [ "${{ github.event.inputs.retrain_all }}" = "true" ]; then
            ARGS="$ARGS --retrain-all"
          fi
          if [ "${{ github.event.inputs.refresh_obs }}" = "true" ]; then
            ARGS="$ARGS --refresh-obs"
          fi
          python -u train_mos.py $ARGS

      - name: Commit updated stations.json and mos_equations.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json mos_equations.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Train public Northern AZ stations with obs_cache [skip ci]"
          git push
