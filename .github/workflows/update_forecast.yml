name: Update Northern AZ HRRR MOS Forecasts

on:
  schedule:
    - cron: '45 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-forecasts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GRIB & numerical packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev
          pip install -q eccodes "numpy<2" pandas requests

      - name: Run operational MOS forecast & verification update
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: python -u update_forecast.py

      - name: Commit updated forecasts and verification history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest_forecasts.json docs/all_forecasts.json docs/verification_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update HRRR MOS forecasts and verification"
          git push
