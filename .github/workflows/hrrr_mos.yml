name: Update Northern AZ HRRR MOS Forecasts

on:
  schedule:
    # Triggers at 01:45Z, 07:45Z, 13:45Z, and 19:45Z daily (right after 48-hr HRRR cycles complete)
    - cron: '45 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libeccodes binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: pip install -q numpy pandas requests eccodes

      - name: Generate latest 48-hr HRRR MOS forecasts
        run: python update_forecast.py

      - name: Commit updated forecast JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest_forecasts.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update HRRR MOS forecasts [skip ci]"
          git push
