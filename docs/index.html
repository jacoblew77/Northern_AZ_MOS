<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northern Arizona HRRR-MOS Guidance</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --border: #334155; --text: #f8fafc; --muted: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { padding: 14px 22px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.3px; }
    .meta-badge { font-size: 0.82rem; color: var(--muted); background: #0f172a; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); }
    .layout { display: grid; grid-template-columns: 1.15fr 1fr; height: calc(100vh - 58px); }
    @media (max-width: 960px) { .layout { grid-template-columns: 1fr; height: auto; } #map { height: 420px; } }
    #map { width: 100%; height: 100%; z-index: 1; }
    .panel { padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
    .stn-header h2 { font-size: 1.3rem; }
    .stn-header p { color: var(--muted); font-size: 0.88rem; margin-top: 3px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; cursor: pointer; transition: border-color 0.15s; }
    .card.active, .card:hover { border-color: var(--accent); }
    .card .lbl { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .card .dt { font-size: 0.85rem; color: var(--text); margin: 2px 0 8px; }
    .card .temp { font-size: 1.9rem; font-weight: 800; }
    .card.min .temp { color: #38bdf8; }
    .card.max .temp { color: #fb923c; }
    .card .sub { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
    .box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
    .box h3 { font-size: 0.92rem; margin-bottom: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .pin-label { background: #1e293b; color: #f8fafc; border: 1px solid #38bdf8; border-radius: 6px; padding: 3px 7px; font-weight: 700; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,0.45); }
  </style>
</head>
<body>
  <header>
    <h1>Northern Arizona HRRRv4 MOS — Max / Min Temperature Guidance</h1>
    <div class="meta-badge" id="run-meta">Loading latest HRRR run...</div>
  </header>

  <div class="layout">
    <div id="map"></div>
    <div class="panel">
      <div class="stn-header">
        <h2 id="stn-title">Select a Station</h2>
        <p id="stn-sub">Click any ASOS or COOP marker on the map</p>
      </div>

      <div class="cards" id="period-cards"></div>

      <div class="box">
        <h3>36-Hour Raw HRRR Hourly Trajectory</h3>
        <canvas id="trajChart" height="125"></canvas>
      </div>

      <div class="box">
        <h3 id="breakdown-title">MOS Equation Predictor Breakdown</h3>
        <table>
          <thead>
            <tr><th>Predictor</th><th class="num">Value</th><th class="num">Weight</th><th class="num">Contrib (°F)</th></tr>
          </thead>
          <tbody id="breakdown-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let forecastData = null;
    let selectedStn = "KFGZ";
    let selectedPeriodIdx = 0;
    let chartInstance = null;

    const map = L.map("map").setView([35.35, -111.25], 7);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      attribution: "&copy; OpenStreetMap &copy; CARTO"
    }).addTo(map);

    function renderStation(stnId) {
      selectedStn = stnId;
      const stn = forecastData.stations[stnId];
      if (!stn) return;

      document.getElementById("stn-title").textContent = `${stn.id} — ${stn.name}`;
      document.getElementById("stn-sub").textContent =
        `Elevation: ${stn.elev_ft.toLocaleString()} ft | Network: ${stn.network} | Prior Obs: ${stn.prev_obs_min}°F / ${stn.prev_obs_max}°F`;

      const cardsEl = document.getElementById("period-cards");
      cardsEl.innerHTML = "";
      stn.periods.forEach((p, idx) => {
        const sign = p.delta_f >= 0 ? "+" : "";
        const card = document.createElement("div");
        card.className = `card ${p.kind} ${idx === selectedPeriodIdx ? "active" : ""}`;
        card.innerHTML = `
          <div class="lbl">${p.label}</div>
          <div class="dt">${p.verify_date}</div>
          <div class="temp">${p.mos_f.toFixed(1)}°F</div>
          <div class="sub">Raw HRRR: ${p.raw_hrrr_f.toFixed(1)}°F (${sign}${p.delta_f.toFixed(1)}°F)</div>
          <div class="sub">Holdout MAE: ${p.holdout_mos_mae}°F (Raw: ${p.holdout_raw_mae}°F)</div>
        `;
        card.onclick = () => { selectedPeriodIdx = idx; renderStation(stnId); };
        cardsEl.appendChild(card);
      });

      // Render predictor breakdown for active card
      const activeP = stn.periods[selectedPeriodIdx] || stn.periods[0];
      if (activeP) {
        document.getElementById("breakdown-title").textContent = `Equation Breakdown — ${activeP.label} (${activeP.verify_date})`;
        const tbody = document.getElementById("breakdown-body");
        tbody.innerHTML = activeP.breakdown.map(row => `
          <tr>
            <td>${row.term}</td>
            <td class="num">${row.value}</td>
            <td class="num">${row.weight}</td>
            <td class="num">${row.contrib >= 0 ? "+" : ""}${row.contrib.toFixed(2)}°F</td>
          </tr>
        `).join("");
      }

      // Render 36-hour trajectory chart
      const ctx = document.getElementById("trajChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: stn.hourly_curve.map(d => d.time_mst),
          datasets: [{
            label: "Raw HRRR 2m Temp (°F)",
            data: stn.hourly_curve.map(d => d.raw_temp_f),
            borderColor: "#38bdf8",
            backgroundColor: "rgba(56, 189, 248, 0.15)",
            borderWidth: 2,
            pointRadius: 2,
            fill: true,
            tension: 0.25
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: "#94a3b8", maxTicksLimit: 9 }, grid: { color: "#334155" } },
            y: { ticks: { color: "#94a3b8" }, grid: { color: "#334155" } }
          }
        }
      });
    }

    fetch("./latest_forecasts.json")
      .then(r => r.json())
      .then(data => {
        forecastData = data;
        document.getElementById("run-meta").textContent =
          `HRRR Run: ${data.hrrr_init_utc} (${data.synoptic_cycle}) | Updated: ${data.updated_mst}`;

        Object.values(data.stations).forEach(stn => {
          const p0 = stn.periods[0];
          const badge = p0 ? `${stn.id}: ${p0.mos_f.toFixed(0)}°F` : stn.id;
          const icon = L.divIcon({ className: "", html: `<div class="pin-label">${badge}</div>`, iconSize: [75, 24] });
          L.marker([stn.lat, stn.lon], { icon })
            .addTo(map)
            .on("click", () => { selectedPeriodIdx = 0; renderStation(stn.id); });
        });

        renderStation(selectedStn);
      })
      .catch(err => {
        document.getElementById("run-meta").textContent = "Run GitHub Action first to generate latest_forecasts.json";
      });
  </script>
</body>
</html>
